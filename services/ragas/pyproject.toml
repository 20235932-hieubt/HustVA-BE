[project]
name = "hustva-ragas"
version = "0.1.0"
description = "Independent Ragas evaluation runner for HustVA"
requires-python = ">=3.12,<3.14"
dependencies = ["ragas==0.4.3", "langchain-community==0.3.31"]

[project.scripts]
hustva-ragas = "hustva_ragas.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hustva_ragas"]
