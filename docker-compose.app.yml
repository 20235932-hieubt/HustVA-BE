# HustVA API + embedding service.
#   docker compose -f docker-compose.app.yml up -d --build
# Chunks, vectors and chats are stored in MongoDB Atlas (MONGODB_URI in .env).
# The named volumes below only keep the crawler's working files, the embedding index state,
# tool settings and the downloaded model, so a restart does not re-download or re-embed.
# Secrets come from .env at run time; they are not baked into the images.
name: hustva

services:
  embedding:
    build: ./services/embedding
    volumes:
      - models:/models
    ports:
      - '127.0.0.1:8001:8001'
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
      EMBEDDING_SERVICE_URL: http://embedding:8001
      CRAWL_DATA_DIR: /data/crawler
      EMBEDDING_DATA_DIR: /data/embedding
      TOOL_DATA_DIR: /data/tools
    volumes:
      - crawler:/data/crawler
      - embedding-state:/data/embedding
      - tool-settings:/data/tools
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      embedding:
        condition: service_healthy
    restart: unless-stopped

volumes:
  models:
  crawler:
  embedding-state:
  tool-settings:
